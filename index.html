<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project SEKAI - MySekai Xray</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="loading-indicator" id="loadingIndicator">加载中...</div>
    
    <div class="controls">
        <textarea id="jsonInput" placeholder="请输入JSON数据"></textarea>
        <br />
        <label>选择场景:</label>
        <div class="scene-checkboxes">
            <label><input type="checkbox" value="scene1" checked> 初始空地</label>
            <label><input type="checkbox" value="scene2" checked> 烂漫花田</label>
            <label><input type="checkbox" value="scene3" checked> 心愿沙滩</label>
            <label><input type="checkbox" value="scene4" checked> 忘却之所</label>
        </div>
        <button onclick="parseAndMarkPoints()">绘制物品</button>
        <button onclick="captureScreenshots()">截图保存所有</button>
        <br />
        <br />
        <details>
            <summary>高级设置</summary>
            <label for="physicalWidth">网格宽度(px):</label>
            <input type="number" id="physicalWidth" value="10" min="1" step="1" />
            <label for="offsetX">X偏移(px):</label>
            <input type="number" id="offsetX" value="0" step="1" />
            <label for="offsetY">Y偏移(px):</label>
            <input type="number" id="offsetY" value="0" step="1" />
            <button onclick="drawGrids()">绘制网格</button>
            <button onclick="clearAll()">清除所有</button>
            <br />
            <div class="direction-buttons">
                <button onclick="setDirection('x+', 'y+')">X+ Y+</button>
                <button onclick="setDirection('x+', 'y-')">X+ Y-</button>
                <button onclick="setDirection('x-', 'y+')">X- Y+</button>
                <button onclick="setDirection('x-', 'y-')">X- Y-</button>
            </div>
        </details>
    </div>
    <div id="mapContainers">
        <div class="container" id="container1">
            <h2>初始空地</h2>
            <div class="rotation-buttons">
                <button onclick="rotateScene('scene1', 90)">顺时针旋转90°</button>
                <button onclick="rotateScene('scene1', -90)">逆时针旋转90°</button>
                <button onclick="resetRotation('scene1')">重置旋转</button>
                <span id="rotationIndicator1">当前角度: 0°</span>
            </div>
            <div class="image-container" id="imageContainer1">
                <img src="img/grassland.png" alt="初始空地" id="image1" />
                <canvas class="grid-canvas" id="gridCanvas1"></canvas>
            </div>
        </div>
        <div class="container" id="container2">
            <h2>烂漫花田</h2>
            <div class="rotation-buttons">
                <button onclick="rotateScene('scene2', 90)">顺时针旋转90°</button>
                <button onclick="rotateScene('scene2', -90)">逆时针旋转90°</button>
                <button onclick="resetRotation('scene2')">重置旋转</button>
                <span id="rotationIndicator2">当前角度: 0°</span>
            </div>
            <div class="image-container" id="imageContainer2">
                <img src="img/flowergarden.png" alt="烂漫花田" id="image2" />
                <canvas class="grid-canvas" id="gridCanvas2"></canvas>
            </div>
        </div>
        <div class="container" id="container3">
            <h2>心愿沙滩</h2>
            <div class="rotation-buttons">
                <button onclick="rotateScene('scene3', 90)">顺时针旋转90°</button>
                <button onclick="rotateScene('scene3', -90)">逆时针旋转90°</button>
                <button onclick="resetRotation('scene3')">重置旋转</button>
                <span id="rotationIndicator3">当前角度: 0°</span>
            </div>
            <div class="image-container" id="imageContainer3">
                <img src="img/beach.png" alt="心愿沙滩" id="image3" />
                <canvas class="grid-canvas" id="gridCanvas3"></canvas>
            </div>
        </div>
        <div class="container" id="container4">
            <h2>忘却之所</h2>
            <div class="rotation-buttons">
                <button onclick="rotateScene('scene4', 90)">顺时针旋转90°</button>
                <button onclick="rotateScene('scene4', -90)">逆时针旋转90°</button>
                <button onclick="resetRotation('scene4')">重置旋转</button>
                <span id="rotationIndicator4">当前角度: 0°</span>
            </div>
            <div class="image-container" id="imageContainer4">
                <img src="img/memorialplace.png" alt="忘却之所" id="image4" />
                <canvas class="grid-canvas" id="gridCanvas4"></canvas>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/grid-renderer.js"></script>
    <script src="js/drag-handler.js"></script>
    <script src="js/item-renderer.js"></script>
    <script src="js/main.js"></script>
    <script src="js/html-to-image.js"></script>
    <script src="js/music-record-mapping.js"></script>
</body>
</html>
